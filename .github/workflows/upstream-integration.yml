name: Scientific source-to-briefing integration
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  hash-verified-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out hub
        uses: actions/checkout@v4
      - name: Check out exact tested science commit
        uses: actions/checkout@v4
        with:
          repository: abhijith-sivaprasadan/residual-pathways
          ref: 33b02d9942f70aad5104ff1bfcd7ec3db6a98d61
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install both independent packages
        run: python -m pip install -e . -e ./upstream
      - name: Reproduce source-derived science release
        run: |
          python -m residual_pathways fetch-tutorial --output upstream/data/tutorial_data.csv
          python -m residual_pathways analyze --input upstream/data/tutorial_data.csv --output outputs/science
      - name: Consume exact results and validate source hash
        run: |
          python -m pathways_hub consume --manifest outputs/science/release/manifest.json --artifact outputs/science/results.json --output outputs/contract
          python - <<'PY'
          import json
          from pathlib import Path
          decision = json.loads(Path("outputs/contract/decision.json").read_text())
          assert decision["status"] == "READY_COVERAGE_ONLY"
          assert decision["identifiability_level"] == "I0"
          expected = json.loads(Path("upstream/data/derived/verified_tutorial_comparison_2050.json").read_text())
          actual = json.loads(Path("outputs/science/results.json").read_text())
          assert actual["comparison"]["rows"] == expected["rows"]
          print("Cross-repo source SHA verified, scientific claim remains coverage only.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verified-cross-repo-handoff
          path: |
            outputs/science/
            outputs/contract/
          retention-days: 30
