name: Synthetic Westeros handoff contract (NO GAMS)
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  export-consume-synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PathwaysHub
        uses: actions/checkout@v4
      - name: Check out exact ResidualPathways exporter revision
        uses: actions/checkout@v4
        with:
          repository: abhijith-sivaprasadan/residual-pathways
          ref: d07995c106534103e685633b6338dff4395fe831
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install both packages for the contract test (NO GAMS)
        run: python -m pip install -e ./upstream -e ".[dev]"
      - name: Run PathwaysHub contract tests
        run: python -m pytest -q tests/test_westeros_contract.py
      - name: Test upstream exporter and downstream verifier with synthetic input
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from subprocess import run
          import sys
          from residual_pathways.messageix_westeros import NOTEBOOKS, UPSTREAM_COMMIT, source_url
          from pathways_hub.westeros_contract import validate_westeros_bundle

          # Artificial fixture simulates the private manifest schema.
          # Absolutely no actual MESSAGEix/GAMS solve occurs in this job.
          fake = {
              "schema": "local-westeros-execution.v1",
              "run_id": "20260101T000000Z_deadbeef",
              "status": "ACTUAL_MESSAGEIX_GAMS_SOLVED",
              "model": "Westeros Electrified",
              "upstream_commit": UPSTREAM_COMMIT,
              "upstream_release": "v3.11.1",
              "evidence_scope": "EDUCATIONAL_MESSAGEIX_GAMS_NOT_AR6",
              "license_content_stored": False,
              "environment": {
                  "actual_solve_performed": True,
                  "message_ix_version": "3.11.1",
                  "ixmp_version": "3.11.1",
                  "upstream_commit": UPSTREAM_COMMIT,
              },
              "notebooks": [
                  {"stage": stage, "source_url": source_url(filename),
                   "sha256": ("a" if stage == "baseline" else "b") * 64,
                   "model_cells": 20}
                  for stage, filename, _ in NOTEBOOKS
              ],
              "solved_scenarios": [
                  {"scenario": "baseline", "version": 1,
                   "has_solution": True, "objective_native": 10.0},
                  {"scenario": "emission_bound", "version": 1,
                   "has_solution": True, "objective_native": 12.0},
              ],
          }
          with TemporaryDirectory() as tmp:
              root = Path(tmp)
              src = root / "manifest.private.json"
              src.write_text(json.dumps(fake), encoding="utf-8")
              bundle_dir = root / "derived"
              run([sys.executable, "-m", "residual_pathways", "westeros-export",
                   "--input", str(src), "--output", str(bundle_dir)], check=True)
              index_path = bundle_dir / "westeros_evidence.manifest.json"
              artifact_path = bundle_dir / "westeros_evidence.json"
              index = json.loads(index_path.read_text())
              raw = artifact_path.read_bytes()
              decision_dir = root / "decision"
              run([sys.executable, "-m", "pathways_hub", "consume-westeros",
                   "--manifest", str(index_path), "--artifact", str(artifact_path),
                   "--output", str(decision_dir)], check=True)
              accepted = json.loads((decision_dir / "decision.json").read_text())
              assert accepted["status"] == "ACCEPTED_AUTHOR_REPORTED_LOCAL"
              assert accepted["independently_reproduced"] is False
              assert accepted["objective_difference_native"] == 2.0
              assert validate_westeros_bundle(index, raw + b" ")["status"] == "BLOCKED"
              print("SYNTHETIC_CONTRACT_CLI_ROUNDTRIP_PASSED — NO GAMS EXECUTION")
          PY
