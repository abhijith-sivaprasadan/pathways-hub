name: Synthetic intake and release contract checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Run complete clearly labelled synthetic exercise
        run: python -m pathways_hub intake --protocol protocols/v1.json --submissions fixtures/team_a.json fixtures/team_b.json fixtures/team_c.json --output outputs/exercise
      - name: Verify issues and evidence boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("outputs/exercise/status.json").read_text())
          assert x["evidence_level"] == "SIMULATION_ONLY"
          assert x["status_counts"] == {"ACCEPTED_SCHEMA_ONLY": 1, "REJECTED": 2}
          assert x["issue_count"] >= 2
          assert "SYNTHETIC_TEST_ONLY" in Path("outputs/exercise/briefing.md").read_text()
          print("All test-intake assertions passed.")
          PY
      - name: Execute corrected synthetic three-team cycle and validate traceability
        run: |
          python -m pathways_hub simulate-cycle --output outputs/synthetic_cycle
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("outputs/synthetic_cycle/cycle.json").read_text())
          assert len(p["decisions"])==2
          assert p["remaining_issue_count"]==0
          assert set(p["corrected_statuses"].values())=={"ACCEPTED_SCHEMA_ONLY"}
          assert p["scientific_approval"]=="NOT_CLAIMED"
          assert p["human_coordination"]=="NOT_DEMONSTRATED"
          PY
      - name: Generate evidence-limited v3 status board
        run: |
          python -m pathways_hub status-board --source protocols/workstream_v3.json --output outputs/v3_status
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("outputs/v3_status/status_board.json").read_text())
          assert len(x["items"])>=10
          assert x["evidence"]=="AUTHOR_DECLARED_MILESTONE_STATUS"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-intake-audit
          path: |
            outputs/exercise/
            outputs/synthetic_cycle/
            outputs/v3_status/
          retention-days: 30
